<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>DH Data Hub</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@100;200;300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Google+Sans:100,200,300,400,500,600,700"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23060d16'/%3E%3Cpath d='M19 20.5h17.5c5.8 0 9.5 3.2 9.5 8.4 0 3.7-1.9 6.3-5.2 7.3 4.1.8 6.7 4 6.7 8.4 0 5.8-4 9.4-10.6 9.4H19V20.5Zm8.2 13.2h7c2.5 0 3.9-1.2 3.9-3.3 0-2.2-1.5-3.3-4.3-3.3h-6.7v6.6Zm0 13.9h7.8c2.9 0 4.5-1.3 4.5-3.7 0-2.4-1.7-3.7-4.8-3.7h-7.5v7.4Z' fill='%23dff5ff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="background-orb background-orb--one" aria-hidden="true"></div>
    <div class="background-orb background-orb--two" aria-hidden="true"></div>
    <div class="background-orb background-orb--three" aria-hidden="true"></div>

    <main class="app-shell">
      <!-- MAIN NAVIGATION (Placeholder) -->
      <nav class="main-nav" aria-label="Main Navigation">
        <button type="button" class="nav-item is-active">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
          <span>Home</span>
        </button>
        <button type="button" class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
          <span>Rosters</span>
        </button>
        <button type="button" class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          <span>Stats</span>
        </button>
        <button type="button" class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 1.1-.9 2-2 2H4"/><path d="M14 14.66V17c0 1.1.9 2 2 2h4"/><path d="M18 2H6v7c0 6 5.33 10 6 10s6-4 6-10z"/></svg>
          <span>LeagueHub</span>
        </button>
        <button type="button" class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a2 2 0 0 0 1.78 2.949h11a2 2 0 0 0 1.78-2.95l-5.068-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M14 16H5.3"/></svg>
          <span>Research</span>
        </button>
        <button type="button" class="nav-item nav-item--more">
          <svg class="nav-icon" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          <span>More</span>
          <svg class="nav-icon nav-icon-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </nav>

      <section class="hero-shell glass-panel">
        <div class="hero-copy">
          <p class="eyebrow">DH DATA HUB – ADVANCED ANALYTICS</p>
          <h1 id="main-title" class="page-title">
            1QB ADP, TRADE VALUES &amp; 2025 STATS
          </h1>
        </div>

        <div class="hero-actions">
          <div class="top-tabs" role="tablist" aria-label="League format">
            <button
              type="button"
              class="top-tab is-active"
              data-primary-tab="1-QB"
              role="tab"
              aria-selected="true"
            >
              1-QB
            </button>
            <button
              type="button"
              class="top-tab"
              data-primary-tab="SFLX"
              role="tab"
              aria-selected="false"
            >
              SFLX
            </button>
          </div>
          <button type="button" class="top-pill top-pill--ghost" aria-disabled="true">
            PICK VALUES
          </button>
        </div>
      </section>

      <section class="controls-shell glass-panel" aria-label="Filters and controls">
        <div class="controls-cluster">
          <div class="category-row" role="tablist" aria-label="Stat categories">
            <button
              type="button"
              class="category-chip is-active"
              data-category="overview"
              role="tab"
              aria-selected="true"
              aria-label="OVERVIEW (ALL)"
            >
              <span class="category-chip__label">OVERVIEW</span>
              <span class="category-chip__meta">(ALL)</span>
            </button>
            <button
              type="button"
              class="category-chip"
              data-category="passing"
              role="tab"
              aria-selected="false"
              aria-label="PASSING (QB)"
            >
              <span class="category-chip__label">PASSING</span>
              <span class="category-chip__meta">(QB)</span>
            </button>
            <button
              type="button"
              class="category-chip"
              data-category="rushing"
              role="tab"
              aria-selected="false"
              aria-label="RUSHING (RB)"
            >
              <span class="category-chip__label">RUSHING</span>
              <span class="category-chip__meta">(RB)</span>
            </button>
            <button
              type="button"
              class="category-chip"
              data-category="receiving"
              role="tab"
              aria-selected="false"
              aria-label="RECEIVING (W/T)"
            >
              <span class="category-chip__label">RECEIVING</span>
              <span class="category-chip__meta">(W/T)</span>
            </button>
          </div>

          <div
            id="receiving-subfilters"
            class="receiving-subfilters"
            aria-label="Receiving position filters"
            hidden
          >
            <button
              type="button"
              class="subfilter-chip is-active"
              data-receiving-filter="WR"
              aria-pressed="true"
            >
              WR
            </button>
            <button
              type="button"
              class="subfilter-chip is-active"
              data-receiving-filter="TE"
              aria-pressed="true"
            >
              TE
            </button>
          </div>
        </div>

        <div class="utility-row">
          <button type="button" class="mini-chip mini-chip--icon" aria-disabled="true">
            <svg
              class="mini-chip__icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"
              />
            </svg>
            <span>KEY</span>
          </button>

          <label class="search-shell" for="player-search">
            <svg
              class="search-shell__icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M10.5 3a7.5 7.5 0 0 1 5.946 12.072l4.241 4.242-1.414 1.414-4.242-4.241A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"
              />
            </svg>
            <input
              id="player-search"
              class="search-shell__input"
              type="search"
              inputmode="search"
              placeholder="Search players..."
              autocomplete="off"
            />
          </label>
        </div>
      </section>

      <section class="grid-shell glass-panel">
        <div class="grid-shell__meta">
          <div>
            <p class="meta-label">ACTIVE VIEW</p>
            <p id="active-view-label" class="meta-value">OVERVIEW (ALL)</p>
          </div>
          <div class="meta-pill-wrap">
            <span class="meta-pill">LIVE DATASET</span>
            <span id="row-count" class="meta-count">0 rows</span>
          </div>
        </div>

        <div class="grid-stage">
          <div class="grid-scroll-wrapper">
            <div id="player-grid" class="data-grid" aria-label="Player stats table"></div>
          </div>

          <div id="grid-overlay" class="grid-stage__overlay">
            <div class="overlay-card">
              <div class="overlay-card__pulse" aria-hidden="true"></div>
              <p class="overlay-card__eyebrow">LOADING DATA</p>
              <h2 id="overlay-title" class="overlay-card__title">
                Preparing SZN.csv
              </h2>
              <p id="overlay-description" class="overlay-card__body">
                Building the Data Hub grid and mapping the requested stat views.
              </p>

              <div id="overlay-actions" class="overlay-card__actions" hidden>
                <button id="file-picker-button" type="button" class="overlay-card__button">
                  Select SZN.csv
                </button>
                <input
                  id="file-picker-input"
                  type="file"
                  accept=".csv,text/csv"
                  hidden
                />
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
