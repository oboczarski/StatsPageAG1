<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>DH Data Hub</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@100;200;300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Google+Sans:100,200,300,400,500,600,700"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23060d16'/%3E%3Cpath d='M19 20.5h17.5c5.8 0 9.5 3.2 9.5 8.4 0 3.7-1.9 6.3-5.2 7.3 4.1.8 6.7 4 6.7 8.4 0 5.8-4 9.4-10.6 9.4H19V20.5Zm8.2 13.2h7c2.5 0 3.9-1.2 3.9-3.3 0-2.2-1.5-3.3-4.3-3.3h-6.7v6.6Zm0 13.9h7.8c2.9 0 4.5-1.3 4.5-3.7 0-2.4-1.7-3.7-4.8-3.7h-7.5v7.4Z' fill='%23dff5ff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="background-orb background-orb--one" aria-hidden="true"></div>
    <div class="background-orb background-orb--two" aria-hidden="true"></div>
    <div class="background-orb background-orb--three" aria-hidden="true"></div>

    <main class="app-shell">
      <nav class="site-nav" aria-label="Main navigation">
        <div class="site-nav__inner">
          <div class="site-nav__brand">
            <img class="site-nav__logo" src="./dh-Logo.png" alt="" width="40" height="40" />
            <div class="site-nav__wordmark-wrap">
              <span class="site-nav__wordmark">Dynasty</span>
              <span class="site-nav__wordmark-accent">Hub</span>
            </div>
          </div>
          <div class="site-nav__links">
            <button type="button" class="nav-btn">
              <svg class="nav-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
              <span class="nav-btn__label">Home</span>
            </button>
            <button type="button" class="nav-btn">
              <svg class="nav-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span class="nav-btn__label">Rosters</span>
            </button>
            <button type="button" class="nav-btn is-active">
              <svg class="nav-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
              <span class="nav-btn__label">DataHub</span>
            </button>
            <button type="button" class="nav-btn">
              <svg class="nav-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
              <span class="nav-btn__label">LeagueHub</span>
            </button>
            <button type="button" class="nav-btn">
              <svg class="nav-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
              <span class="nav-btn__label">Research</span>
            </button>
            <button type="button" class="nav-btn">
              <svg class="nav-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
              <span class="nav-btn__label">More</span>
            </button>
          </div>
        </div>
      </nav>

      <section class="hero-shell glass-panel">
        <div class="view-tabs" role="tablist" aria-label="Data views">
          <button type="button" class="view-tab is-active" role="tab" aria-selected="true">
            <svg class="view-tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
            <span class="view-tab__label">Stats</span>
          </button>
          <button type="button" class="view-tab" role="tab" aria-selected="false">
            <svg class="view-tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
            <span class="view-tab__label">Rankings</span>
          </button>
          <button type="button" class="view-tab" role="tab" aria-selected="false">
            <svg class="view-tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>
            <span class="view-tab__label">ADP &amp; Values</span>
          </button>
          <button type="button" class="view-tab" role="tab" aria-selected="false">
            <svg class="view-tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
            <span class="view-tab__label">Rookies</span>
          </button>
          <button type="button" class="view-tab" role="tab" aria-selected="false">
            <svg class="view-tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
            <span class="view-tab__label">Ownership</span>
          </button>
        </div>
        <div class="hero-copy">
          <p class="eyebrow">DH DATA HUB – ADVANCED ANALYTICS</p>
          <h1 id="main-title" class="page-title">
            1QB ADP, TRADE VALUES &amp; 2025 STATS
          </h1>
        </div>

        <div class="hero-actions">
          <div class="top-tabs" role="tablist" aria-label="League format">
            <button
              type="button"
              class="top-tab is-active"
              data-primary-tab="1-QB"
              role="tab"
              aria-selected="true"
            >
              1-QB
            </button>
            <button
              type="button"
              class="top-tab"
              data-primary-tab="SFLX"
              role="tab"
              aria-selected="false"
            >
              SFLX
            </button>
          </div>
          <button type="button" class="top-pill top-pill--ghost" aria-disabled="true">
            PICK VALUES
          </button>
        </div>
      </section>

      <section class="controls-shell glass-panel" aria-label="Filters and controls">
        <div class="controls-cluster">
          <div class="category-row" role="tablist" aria-label="Stat categories">
            <button
              type="button"
              class="category-chip is-active"
              data-category="overview"
              role="tab"
              aria-selected="true"
              aria-label="OVERVIEW (ALL)"
            >
              <span class="category-chip__label">OVERVIEW</span>
              <span class="category-chip__meta">(ALL)</span>
            </button>
            <button
              type="button"
              class="category-chip"
              data-category="passing"
              role="tab"
              aria-selected="false"
              aria-label="PASSING (QB)"
            >
              <span class="category-chip__label">PASSING</span>
              <span class="category-chip__meta">(QB)</span>
            </button>
            <button
              type="button"
              class="category-chip"
              data-category="rushing"
              role="tab"
              aria-selected="false"
              aria-label="RUSHING (RB)"
            >
              <span class="category-chip__label">RUSHING</span>
              <span class="category-chip__meta">(RB)</span>
            </button>
            <button
              type="button"
              class="category-chip"
              data-category="receiving"
              role="tab"
              aria-selected="false"
              aria-label="RECEIVING (W/T)"
            >
              <span class="category-chip__label">RECEIVING</span>
              <span class="category-chip__meta">(W/T)</span>
            </button>
          </div>

          <div
            id="receiving-subfilters"
            class="receiving-subfilters"
            aria-label="Receiving position filters"
            hidden
          >
            <button
              type="button"
              class="subfilter-chip is-active"
              data-receiving-filter="WR"
              aria-pressed="true"
            >
              WR
            </button>
            <button
              type="button"
              class="subfilter-chip is-active"
              data-receiving-filter="TE"
              aria-pressed="true"
            >
              TE
            </button>
          </div>
        </div>

        <div class="utility-row">
          <button type="button" class="mini-chip mini-chip--icon" aria-disabled="true">
            <svg
              class="mini-chip__icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"
              />
              <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/>
            </svg>
            <span>KEY</span>
          </button>

          <label class="search-shell" for="player-search">
            <svg
              class="search-shell__icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M10.5 3a7.5 7.5 0 0 1 5.946 12.072l4.241 4.242-1.414 1.414-4.242-4.241A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"
              />
            </svg>
            <input
              id="player-search"
              class="search-shell__input"
              type="search"
              inputmode="search"
              placeholder="Search players..."
              autocomplete="off"
            />
          </label>
        </div>
      </section>

      <section class="grid-shell glass-panel">
        <div class="grid-shell__meta">
          <div>
            <p class="meta-label">ACTIVE VIEW</p>
            <p id="active-view-label" class="meta-value">OVERVIEW (ALL)</p>
          </div>
          <div class="meta-pill-wrap">
            <span class="meta-pill">LIVE DATASET</span>
            <span id="row-count" class="meta-count">0 rows</span>
          </div>
        </div>

        <div class="grid-stage">
          <div class="grid-scroll-wrapper">
            <div id="player-grid" class="data-grid" aria-label="Player stats table"></div>
          </div>

          <div id="grid-overlay" class="grid-stage__overlay">
            <div class="overlay-card">
              <div class="overlay-card__pulse" aria-hidden="true"></div>
              <p class="overlay-card__eyebrow">LOADING DATA</p>
              <h2 id="overlay-title" class="overlay-card__title">
                Preparing SZN.csv
              </h2>
              <p id="overlay-description" class="overlay-card__body">
                Building the Data Hub grid and mapping the requested stat views.
              </p>

              <div id="overlay-actions" class="overlay-card__actions" hidden>
                <button id="file-picker-button" type="button" class="overlay-card__button">
                  Select SZN.csv
                </button>
                <input
                  id="file-picker-input"
                  type="file"
                  accept=".csv,text/csv"
                  hidden
                />
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
