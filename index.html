<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>DH Data Hub</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@100;200;300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Google+Sans:100,200,300,400,500,600,700"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23060d16'/%3E%3Cpath d='M19 20.5h17.5c5.8 0 9.5 3.2 9.5 8.4 0 3.7-1.9 6.3-5.2 7.3 4.1.8 6.7 4 6.7 8.4 0 5.8-4 9.4-10.6 9.4H19V20.5Zm8.2 13.2h7c2.5 0 3.9-1.2 3.9-3.3 0-2.2-1.5-3.3-4.3-3.3h-6.7v6.6Zm0 13.9h7.8c2.9 0 4.5-1.3 4.5-3.7 0-2.4-1.7-3.7-4.8-3.7h-7.5v7.4Z' fill='%23dff5ff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="background-orb background-orb--one" aria-hidden="true"></div>
    <div class="background-orb background-orb--two" aria-hidden="true"></div>
    <div class="background-orb background-orb--three" aria-hidden="true"></div>

    <main class="app-shell">
      <section class="app-nav-shell" aria-label="Primary placeholder navigation">
        <div class="brand-lockup">
          <div class="brand-lockup__frame">
            <img
              class="brand-lockup__logo"
              src="./dh-Logo.png"
              alt="Dynasty Hub logo"
            />
          </div>
          <div class="brand-lockup__text">
            <p class="brand-lockup__eyebrow">Premium Dynasty Intelligence</p>
            <p class="brand-lockup__name">Dynasty Hub</p>
          </div>
        </div>

        <nav class="app-nav-rail" aria-label="Primary navigation">
          <button type="button" class="app-nav-button">
            <svg class="app-nav-button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3 10.5 12 3l9 7.5" />
              <path d="M5 9.5V21h14V9.5" />
              <path d="M10 21v-6h4v6" />
            </svg>
            <span>Home</span>
          </button>
          <button type="button" class="app-nav-button">
            <svg class="app-nav-button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            <span>Rosters</span>
          </button>
          <button type="button" class="app-nav-button is-active" aria-pressed="true">
            <svg class="app-nav-button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <ellipse cx="12" cy="5" rx="9" ry="3" />
              <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5" />
              <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3" />
            </svg>
            <span>DataHub</span>
          </button>
          <button type="button" class="app-nav-button">
            <svg class="app-nav-button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M8 21h8" />
              <path d="M12 17v4" />
              <path d="M7 4h10v4a5 5 0 0 1-10 0V4Z" />
              <path d="M5 9H4a2 2 0 0 1-2-2V5h3" />
              <path d="M19 9h1a2 2 0 0 0 2-2V5h-3" />
            </svg>
            <span>LeagueHub</span>
          </button>
          <button type="button" class="app-nav-button">
            <svg class="app-nav-button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m10.5 13.5-3 3" />
              <path d="m13.5 10.5 3-3" />
              <path d="m12 12 7-7" />
              <path d="m17 4 3 3" />
              <path d="M4 20 9.5 8.5 15.5 14.5 4 20Z" />
              <path d="M9.5 8.5 6 5" />
            </svg>
            <span>Research</span>
          </button>
          <button type="button" class="app-nav-button">
            <svg class="app-nav-button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="5" cy="12" r="1.6" style="fill: currentColor; stroke: none" />
              <circle cx="12" cy="12" r="1.6" style="fill: currentColor; stroke: none" />
              <circle cx="19" cy="12" r="1.6" style="fill: currentColor; stroke: none" />
            </svg>
            <span>More</span>
          </button>
        </nav>
      </section>

      <section class="hero-shell glass-panel">
        <div class="view-tab-strip" aria-label="Placeholder future views">
          <button type="button" class="view-tab is-active" aria-pressed="true">
            <svg class="view-tab__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3 3v18h18" />
              <path d="M7 16v-5" />
              <path d="M12 16V8" />
              <path d="M17 16v-2" />
            </svg>
            <span>Stats</span>
          </button>
          <button type="button" class="view-tab">
            <svg class="view-tab__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 8V4" />
              <path d="M8 4h8" />
              <path d="m9 4-4 7 4 1 3-4" />
              <path d="m15 4 4 7-4 1-3-4" />
              <circle cx="12" cy="17" r="5" />
            </svg>
            <span>Rankings</span>
          </button>
          <button type="button" class="view-tab">
            <svg class="view-tab__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 3v18" />
              <path d="M3 7h18" />
              <path d="m5 7-3 7h6l-3-7Z" />
              <path d="m19 7-3 7h6l-3-7Z" />
              <path d="M7 21h10" />
            </svg>
            <span>ADP &amp; Values</span>
          </button>
          <button type="button" class="view-tab">
            <svg class="view-tab__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 20V10" />
              <path d="M7 20h10" />
              <path d="M12 10c0-3.6 2.6-6 6-6 0 3.4-2.4 6-6 6Z" />
              <path d="M12 14c0-3.1-2.1-5.5-5.5-6 0 3.6 2.1 6 5.5 6Z" />
            </svg>
            <span>Rookies</span>
          </button>
          <button type="button" class="view-tab">
            <svg class="view-tab__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="8.5" cy="15.5" r="4.5" />
              <path d="m12 12 6-6" />
              <path d="m18 6 2 2" />
              <path d="m20.5 3.5 1 1" />
              <path d="M5 19 2 22" />
            </svg>
            <span>Ownership</span>
          </button>
        </div>

        <div class="hero-header">
          <div class="hero-copy">
            <p class="eyebrow">DH DATA HUB – ADVANCED ANALYTICS</p>
            <h1 id="main-title" class="page-title">
              1QB ADP, TRADE VALUES &amp; 2025 STATS
            </h1>
          </div>

          <div class="hero-actions">
            <div class="top-tabs" role="tablist" aria-label="League format">
              <button
                type="button"
                class="top-tab is-active"
                data-primary-tab="1-QB"
                role="tab"
                aria-selected="true"
              >
                1-QB
              </button>
              <button
                type="button"
                class="top-tab"
                data-primary-tab="SFLX"
                role="tab"
                aria-selected="false"
              >
                SFLX
              </button>
            </div>
            <button type="button" class="top-pill top-pill--ghost" aria-disabled="true">
              PICK VALUES
            </button>
          </div>
        </div>
      </section>

      <section class="controls-shell glass-panel" aria-label="Filters and controls">
        <div class="controls-cluster">
          <div class="category-row" role="tablist" aria-label="Stat categories">
            <button
              type="button"
              class="category-chip is-active"
              data-category="overview"
              role="tab"
              aria-selected="true"
              aria-label="OVERVIEW (ALL)"
            >
              <span class="category-chip__label">OVERVIEW</span>
              <span class="category-chip__meta">(ALL)</span>
            </button>
            <button
              type="button"
              class="category-chip"
              data-category="passing"
              role="tab"
              aria-selected="false"
              aria-label="PASSING (QB)"
            >
              <span class="category-chip__label">PASSING</span>
              <span class="category-chip__meta">(QB)</span>
            </button>
            <button
              type="button"
              class="category-chip"
              data-category="rushing"
              role="tab"
              aria-selected="false"
              aria-label="RUSHING (RB)"
            >
              <span class="category-chip__label">RUSHING</span>
              <span class="category-chip__meta">(RB)</span>
            </button>
            <button
              type="button"
              class="category-chip"
              data-category="receiving"
              role="tab"
              aria-selected="false"
              aria-label="RECEIVING (W/T)"
            >
              <span class="category-chip__label">RECEIVING</span>
              <span class="category-chip__meta">(W/T)</span>
            </button>
          </div>

          <div
            id="receiving-subfilters"
            class="receiving-subfilters"
            aria-label="Receiving position filters"
            hidden
          >
            <button
              type="button"
              class="subfilter-chip is-active"
              data-receiving-filter="WR"
              aria-pressed="true"
            >
              WR
            </button>
            <button
              type="button"
              class="subfilter-chip is-active"
              data-receiving-filter="TE"
              aria-pressed="true"
            >
              TE
            </button>
          </div>
        </div>

        <div class="utility-row">
          <button type="button" class="mini-chip mini-chip--icon" aria-disabled="true">
            <svg
              class="mini-chip__icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"
              />
              <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/>
            </svg>
            <span>KEY</span>
          </button>

          <label class="search-shell" for="player-search">
            <svg
              class="search-shell__icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M10.5 3a7.5 7.5 0 0 1 5.946 12.072l4.241 4.242-1.414 1.414-4.242-4.241A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"
              />
            </svg>
            <input
              id="player-search"
              class="search-shell__input"
              type="search"
              inputmode="search"
              placeholder="Search players..."
              autocomplete="off"
            />
          </label>
        </div>
      </section>

      <section class="grid-shell glass-panel">
        <div class="grid-shell__meta">
          <div>
            <p class="meta-label">ACTIVE VIEW</p>
            <p id="active-view-label" class="meta-value">OVERVIEW (ALL)</p>
          </div>
          <div class="meta-pill-wrap">
            <span class="meta-pill">LIVE DATASET</span>
            <span id="row-count" class="meta-count">0 rows</span>
          </div>
        </div>

        <div class="grid-stage">
          <div class="grid-scroll-wrapper">
            <div id="player-grid" class="data-grid" aria-label="Player stats table"></div>
          </div>

          <div id="grid-overlay" class="grid-stage__overlay">
            <div class="overlay-card">
              <div class="overlay-card__pulse" aria-hidden="true"></div>
              <p class="overlay-card__eyebrow">LOADING DATA</p>
              <h2 id="overlay-title" class="overlay-card__title">
                Preparing SZN.csv
              </h2>
              <p id="overlay-description" class="overlay-card__body">
                Building the Data Hub grid and mapping the requested stat views.
              </p>

              <div id="overlay-actions" class="overlay-card__actions" hidden>
                <button id="file-picker-button" type="button" class="overlay-card__button">
                  Select SZN.csv
                </button>
                <input
                  id="file-picker-input"
                  type="file"
                  accept=".csv,text/csv"
                  hidden
                />
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
